[project]   # 项目元信息和外部依赖
name = "Xstar-infer"
version = "1.0"
description = "Xstar-Infer 分布式多语言推理引擎"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [    # 装进 venv 的外部包
    "einops>=0.8",      # tensor operations
    "humanfriendly",
    "matplotlib",
    "numpy",
    "pytest>=8",
    "regex>=2026.3.32",
    "torch~=2.11.0",
    "tqdm>=4.67.1",
    "pandas>=2",
    "ruff>=0.15.10",
    "transformers==4.40.1",
    "pybind11>=2.13",
    "fastapi",
    "uvicorn",
    "httpx",     # 测试时用 httpx 调自己的 HTTP 服务
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = false
python-preference = "managed"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"
filterwarnings = [
    "ignore::DeprecationWarning:torch.jit.*",
    "ignore:Attempting to run cuBLAS:UserWarning",
    "ignore:TensorFloat32:UserWarning",
]

[tool.ruff]
line-length = 180

[tool.ruff.lint.extend-per-file-ignores]
# Also ignore `E402` in all `__init__.py` files.
"__init__.py" = ["E402", "F401", "F403", "E501"]

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]
